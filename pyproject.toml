[project]
name = "reasoning-rag"
version = "0.1.0"
description = "Reasoning-driven document QA system for Caritas Switzerland"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",          # File uploads
    "sse-starlette>=2.1.0",              # Server-Sent Events

    # LLM
    "anthropic>=0.42.0",                  # Claude API

    # Document Parsing
    "docling>=2.15.0",                    # PDF/DOCX/PPTX → Markdown

    # Database
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",                  # Async SQLite

    # Configuration
    "pydantic-settings>=2.6.0",

    # Templating (Phase 2)
    "jinja2>=3.1.4",

    # Utilities
    "python-dateutil>=2.9.0",
    "aiofiles>=24.1.0",                   # Async file operations
    "python-magic>=0.4.27",              # File type detection
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",                      # Test client for FastAPI
    "ruff>=0.8.0",                        # Linting
    "mypy>=1.13.0",                       # Type checking
    "pytest-mock>=3.14.0",               # Mocking support
]

embeddings = [
    # Phase 2: Fallback search
    "sentence-transformers>=3.3.0",
    "faiss-cpu>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
cache_dir = "/tmp/pytest_cache_reasoning_rag"
filterwarnings = [
    "ignore::DeprecationWarning:docling_core\\.types\\.doc\\.document",
    "ignore::DeprecationWarning:pydantic\\._internal\\._config",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line length handled separately

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
