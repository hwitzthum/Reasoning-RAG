<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Reasoning RAG{% endblock %}</title>
    <script>
    (() => {
        try {
            const choice = sessionStorage.getItem("rrag-theme") || "system";
            const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            const effective = choice === "system" ? (prefersDark ? "dark" : "light") : choice;
            document.documentElement.setAttribute("data-theme-choice", choice);
            document.documentElement.setAttribute("data-theme", effective);
        } catch (_error) {
            document.documentElement.setAttribute("data-theme-choice", "system");
            document.documentElement.setAttribute("data-theme", "light");
        }
    })();
    </script>
    <link rel="stylesheet" href="/static/css/styles.css">
    {% block head %}{% endblock %}
</head>
<body>
<div class="bg-orb bg-orb-a"></div>
<div class="bg-orb bg-orb-b"></div>
<main class="app-shell">
    <section class="theme-toolbar card" aria-label="Theme controls">
        <label for="theme-select">Theme</label>
        <select id="theme-select" aria-label="Theme selection">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="sepia">Sepia</option>
            <option value="high-contrast">High Contrast</option>
        </select>
    </section>
    {% block content %}{% endblock %}
</main>
<script src="/static/js/htmx.min.js"></script>
<script>
(() => {
    const select = document.getElementById("theme-select");
    if (!select) return;

    const key = "rrag-theme";
    const validThemes = new Set(["system", "light", "dark", "sepia", "high-contrast"]);
    const media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

    const resolveTheme = (choice) => {
        if (choice === "system") {
            return media && media.matches ? "dark" : "light";
        }
        return choice;
    };

    const applyTheme = (choice) => {
        const safeChoice = validThemes.has(choice) ? choice : "system";
        const effective = resolveTheme(safeChoice);
        document.documentElement.setAttribute("data-theme-choice", safeChoice);
        document.documentElement.setAttribute("data-theme", effective);
        select.value = safeChoice;
        sessionStorage.setItem(key, safeChoice);
    };

    const initialChoice = sessionStorage.getItem(key) || document.documentElement.getAttribute("data-theme-choice") || "system";
    applyTheme(initialChoice);

    select.addEventListener("change", () => applyTheme(select.value));

    if (media && typeof media.addEventListener === "function") {
        media.addEventListener("change", () => {
            if ((sessionStorage.getItem(key) || "system") === "system") {
                applyTheme("system");
            }
        });
    }
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
